<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fulgam | فلجرام</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body { font-family: Arial, sans-serif; background: #0e1621; color: white; margin: 0; padding: 0; }
        header { background: #17212b; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        header h1 { margin: 0; font-size: 20px; color: #0088cc; }
        .settings-icon { color: white; font-size: 20px; cursor: pointer; }
        .chat-list { padding: 10px; }
        .chat-item { background: #17212b; padding: 15px; border-radius: 10px; margin-bottom: 10px; display: flex; align-items: center; }
        .avatar { width: 50px; height: 50px; background: #0088cc; border-radius: 50%; margin-left: 15px; display: flex; justify-content: center; align-items: center; font-weight: bold; }
        .chat-info h3 { margin: 0 0 5px 0; font-size: 16px; }
        .chat-info p { margin: 0; font-size: 13px; color: #7f91a4; }
        .footer { position: fixed; bottom: 0; width: 100%; background: #17212b; text-align: center; padding: 10px; font-size: 12px; color: #7f91a4; }
    </style>
</head>
<body>

    <header>
        <h1>Fulgam | فلجرام</h1>
        <span class="settings-icon">⚙️</span>
    </header>

    <div class="chat-list">
        <div class="chat-item">
            <div class="avatar">F</div>
            <div class="chat-info">
                <h3>فريق فلجرام</h3>
                <p>مرحباً بك في التطبيق!</p>
            </div>
        </div>
        <div class="chat-item">
            <div class="avatar">K</div>
            <div class="chat-info">
                <h3>ڪايلوس | Kailos</h3>
                <p>المطور الرسمي للتطبيق</p>
            </div>
        </div>
    </div>

    <div class="footer">
        تم صنع هذا التطبيق بواسطة ڪايلوس | @lqxuf
    </div>

</body>
</html>
